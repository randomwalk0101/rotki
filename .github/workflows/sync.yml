# 机器人任务名称
name: Sync Upstream (from rotki/rotki)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Sync Upstream Repository
        uses: repo-sync/github-sync@v2
        with:
          # ⚠️ 关键：原始仓库地址
          upstream_repository: "rotki/rotki"
          
          # ⚠️ 关键：原始仓库的主分支 (Rotki 用的是 develop)
          upstream_branch: "develop"
          
          # ⚠️ 关键：你的 fork 仓库的目标分支 (也应该是 develop)
          target_branch: "develop"
          
          token: ${{ secrets.GITHUB_TOKEN }}
